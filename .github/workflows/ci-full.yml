name: ci-full

on:
  schedule:
    # Weekdays 09:23 UTC (not on the hour: GitHub delays or drops scheduled runs queued at :00, seen 4-5 h late here) — race, govulncheck (benchmark gates run in downshift-labs).
    - cron: "23 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cross-OS run of the same packages and commands as ci.yml `test-os`. The PR
  # gate runs it only for OS-sensitive diffs; the nightly catches a regression
  # the PR path did not touch. The full race suite is in the `full` job below.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build downshift CLI
        run: go build -o downshift ./cmd/downshift

      - name: Test OS-sensitive packages (all)
        run: go test -timeout 15m ./internal/paths/ ./internal/execwrap/ ./internal/contextopt/ ./internal/hookctx/

      - name: Test cmd/downshift (macOS only)
        if: matrix.os == 'macos-latest'
        run: go test -timeout 15m -run 'Setup|Steering|Wrapper|Config|Session|Display|Path|Project' ./cmd/downshift/

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"

      - name: Test local LangGraph planner
        run: |
          cd orchestration
          uv run --locked python -m unittest discover -s tests -v

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Build
        run: go build ./...

      - name: Test disabled Codex lifecycle observer POC
        run: go test -race ./internal/lifecycleobserver

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if gofmt -l . | grep -q .; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Security vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Test (race + cover)
        # internal/core alone takes 215-290 s under -race; the default 10 min package
        # timeout was hit once on a slow runner (2026-10-16), hence 30m.
        run: go test -race -cover -timeout 30m ./...

      - name: Build downshift CLI
        run: go build -ldflags "-s -w" -o downshift ./cmd/downshift

      - name: Adapter smoke tests
        run: ./scripts/smoke-test.sh

      - name: Export directional stats
        run: ./downshift stats --days=30 --export > stats-export.json

      - name: Upload stats export artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-export
          path: stats-export.json
          if-no-files-found: ignore

  # Opens (or comments on) one tracking issue when a scheduled ci-full run
  # fails, so a red night is not missed. Manual dispatches do not alert.
  alert:
    needs: [test-os, full]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "ci-full failing on main"
    steps:
      - name: Open or update the tracking issue
        run: |
          body="Scheduled ci-full failed: ${RUN_URL} (commit ${GITHUB_SHA})."
          num=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
