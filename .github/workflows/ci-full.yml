name: ci-full

on:
  schedule:
    # Weekdays 09:00 UTC — race, govulncheck (benchmark gates run in downshift-labs).
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Test local LangGraph planner
        run: |
          cd orchestration
          uv run --locked python -m unittest discover -s tests -v

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Build
        run: go build ./...

      - name: Test disabled Codex lifecycle observer POC
        run: go test -race ./internal/lifecycleobserver

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if gofmt -l . | grep -q .; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Security vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Test (race + cover)
        # internal/core alone takes 215-290 s under -race; the default 10 min package
        # timeout was hit once on a slow runner (2026-10-16), hence 30m.
        run: go test -race -cover -timeout 30m ./...

      - name: Build downshift CLI
        run: go build -ldflags "-s -w" -o downshift ./cmd/downshift

      - name: Adapter smoke tests
        run: ./scripts/smoke-test.sh

      - name: Export directional stats
        run: ./downshift stats --days=30 --export > stats-export.json

      - name: Upload stats export artifact
        uses: actions/upload-artifact@v7
        with:
          name: stats-export
          path: stats-export.json
          if-no-files-found: ignore
