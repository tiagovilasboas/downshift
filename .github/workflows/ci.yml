name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Test local LangGraph planner
        run: |
          cd orchestration
          uv run --locked python -m unittest discover -s tests -v

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Build
        run: go build ./...

      - name: Test disabled Codex lifecycle observer POC
        run: go test -race ./internal/lifecycleobserver

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Benchmark Regression Gate
        run: |
          go run ./cmd/downshift benchmark benchmark/tasks.json --min-tier-accuracy=0.60

  release:
    needs: test
    runs-on: ubuntu-latest
    # Only run on version tags (v0.1.0-beta.1, v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create GitHub releases and upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # goreleaser needs the full git history for changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
