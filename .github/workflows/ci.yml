name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      go: ${{ steps.classify.outputs.go }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          eval "$(bash scripts/ci-classify-changes.sh)"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Docs-only skip
        if: needs.changes.outputs.docs_only == '1'
        run: echo "Docs-only diff; Go CI skipped."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.go == '1'
        with:
          go-version: "1.27"
          cache: true

      - name: No Go changes
        if: needs.changes.outputs.go != '1'
        run: echo "No Go changes in diff."

      - name: Build downshift CLI
        if: needs.changes.outputs.go == '1'
        run: go build -ldflags "-s -w" -o downshift ./cmd/downshift

      - name: Vet
        if: needs.changes.outputs.go == '1'
        run: go vet ./...

      - name: Format check
        if: needs.changes.outputs.go == '1'
        run: |
          if gofmt -l . | grep -q .; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Test
        if: needs.changes.outputs.go == '1'
        run: go test ./...

      - name: Adapter smoke tests
        if: needs.changes.outputs.go == '1'
        run: ./scripts/smoke-test.sh

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != '1'
        with:
          node-version: "22"

      - name: Test report counters and Cursor quota decoder
        if: needs.changes.outputs.docs_only != '1'
        run: node --test web/app.test.cjs internal/cursorbridge/extension/decoder.test.cjs

  python:
    needs: changes
    if: needs.changes.outputs.python == '1' || needs.changes.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Test local LangGraph planner
        if: needs.changes.outputs.python == '1' || needs.changes.outputs.go == '1'
        run: |
          cd orchestration
          uv run --locked python -m unittest discover -s tests -v

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Test manual Antigravity evidence sensor
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_collect_antigravity_evidence.py' -v

  build-cross-platform:
    needs: [changes, test]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == '1'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true

      - name: Build downshift for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -o downshift-${{ matrix.goos }}-${{ matrix.goarch }} \
          -ldflags="-s -w" ./cmd/downshift

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
