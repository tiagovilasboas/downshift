name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          # go.mod has zero external dependencies; disable cache to silence warning (I3)
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Test local LangGraph planner
        run: |
          cd orchestration
          uv run --locked python -m unittest discover -s tests -v

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Build
        run: go build ./...

      - name: Test disabled Codex lifecycle observer POC
        run: go test -race ./internal/lifecycleobserver

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if gofmt -l . | grep -q .; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Security vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ~/go/bin/govulncheck ./...


      - name: Test
        run: go test -race -cover ./...

      # Regression nets only: the seed is the curated set and the holdout is
      # burned (tuned to 100%). Both must keep FRONTIER→SMALL and
      # FRONTIER→MID at zero. Passing them says nothing about unseen traffic.
      - name: Benchmark Regression Gate
        run: |
          go run ./cmd/downshift benchmark benchmark/tasks.json --gate --min-tier-accuracy=0.60 --max-frontier-to-mid=0
          go run ./cmd/downshift benchmark benchmark/holdout.json --gate --min-tier-accuracy=0.80 --max-frontier-to-mid=0

      # Evaluation-only splits: reported, never gated, never tuned against.
      - name: Fresh split report
        run: go run ./cmd/downshift benchmark benchmark/fresh.json

      - name: Heldout2 split report
        run: go run ./cmd/downshift benchmark benchmark/heldout2.json

      - name: Blind-vitrine split report (tier labels)
        run: go run ./cmd/downshift benchmark benchmark/blind-vitrine.json

      - name: Fresh split guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | bash scripts/fresh-guard.sh

      # Offline only: no model calls. --record refuses to run when CI is set.
      - name: Outcome eval checks (offline)
        run: go run ./cmd/downshift eval-outcome --verify

      - name: README numbers match the generated report
        run: go run ./cmd/downshift eval-outcome --report --check README.md

      - name: Adapter Smoke Tests
        run: |
          ./scripts/smoke-test.sh

      - name: Export Directional Stats
        run: |
          go run ./cmd/downshift stats --days=30 --export > stats-export.json

      - name: Upload Stats Export Artifact
        uses: actions/upload-artifact@v7
        with:
          name: stats-export
          path: stats-export.json
          if-no-files-found: ignore

  build-cross-platform:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows ARM64 has limited user base
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Build downshift for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -o downshift-${{ matrix.goos }}-${{ matrix.goarch }} \
          -ldflags="-s -w" ./cmd/downshift

  release:
    needs: test
    runs-on: ubuntu-latest
    # Only run on version tags (v0.1.0-beta.1, v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create GitHub releases and upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # goreleaser needs the full git history for changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
