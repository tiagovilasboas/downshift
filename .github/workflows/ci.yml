# Three events, three jobs of the same pipeline. Heavy jobs must not move back
# onto the main push path without an owner decision.
#
#   pull_request  CI gates: `changes`, `test` (the required check), `race` on the
#                 changed packages, `test-os` when os_sensitive=1, `python` when
#                 python=1, `e2e` when go=1 (informational, not required).
#   push to main  Fast sanity: `changes`, `test` (same required check, so main
#                 keeps the gate the PR passed), `python` when python=1, `e2e`
#                 (informational, not required). Nothing else.
#   tag v*        CD path with full verification: `test`, `test-os`, full `race`,
#                 `build-cross-platform`, then `release` (goreleaser and
#                 attestation) only after all four pass.
#   nightly       ci-full.yml runs the full race suite and cross-OS tests, so a
#                 Windows or macOS regression surfaces the same night.
#
# The classifier (scripts/ci-classify-changes.sh) still forces os_sensitive=1
# and go=1 on main and tags; the job conditions below decide what runs.

name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # Merge queue runs: the same gates on the queued merge result, so `test`
  # reports on the queue branch and the queue can merge without a rebase.
  merge_group:
  # Also started by sync-prices on chore/sync-prices, whose PR (opened with
  # GITHUB_TOKEN) cannot trigger pull_request runs.
  workflow_dispatch:

# Pull requests cancel their superseded runs. Pushes to main do not: with
# cancellation, a docs-only push right after a code push cancelled the code
# run and then skipped the Go job itself, leaving main unverified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      go: ${{ steps.classify.outputs.go }}
      python: ${{ steps.classify.outputs.python }}
      os_sensitive: ${{ steps.classify.outputs.os_sensitive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the path classifier
        run: bash scripts/test-ci-classify-changes.sh

      - name: Test the race package filter
        run: bash scripts/test-ci-race-packages.sh

      - name: Classify changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          eval "$(bash scripts/ci-classify-changes.sh)"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "os_sensitive=$os_sensitive" >> "$GITHUB_OUTPUT"

  # The required `test` check, split into parallel jobs so the go test wall no
  # longer runs behind vet/staticcheck/format on one runner. Three jobs:
  #   test-checks  build + vet + staticcheck + format + smoke + node decoder,
  #                run ONCE (not per shard).
  #   test-shard   go test, fanned out across a deterministic, complete package
  #                partition (scripts/ci-shard-packages.sh). Shard 0 is
  #                cmd/downshift alone (the ~63 s floor of the suite); shard 1 is
  #                every other package (~30-40 s). They run on separate runners.
  #   test         aggregator; the branch-protection required check. It depends
  #                on both and, with `if: always()`, fails unless every shard and
  #                the checks job succeeded (or were skipped on a docs-only diff).
  #                Protection keeps meaning exactly what it did: `test` is green
  #                only when the whole Go gate passed.
  test-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOWNSHIFT_TEST_TIMING: "1" # enforce wall-clock test budgets (internal/testenv/timing.go)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docs-only skip
        if: needs.changes.outputs.docs_only == '1'
        run: echo "Docs-only diff; Go CI skipped."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.go == '1'
        with:
          go-version-file: go.mod
          cache: true

      - name: No Go changes
        if: needs.changes.outputs.go != '1'
        run: echo "No Go changes in diff."

      - name: Build downshift CLI
        if: needs.changes.outputs.go == '1'
        run: go build -ldflags "-s -w" -o downshift ./cmd/downshift

      - name: Vet
        if: needs.changes.outputs.go == '1'
        run: go vet ./...

      - name: Staticcheck
        if: needs.changes.outputs.go == '1'
        # Pinned release; checks are in staticcheck.conf. Build it with the
        # module's toolchain (go.mod), or it rejects the go1.27 packages.
        run: GOTOOLCHAIN="$(go env GOVERSION)" go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: Format check
        if: needs.changes.outputs.go == '1'
        run: |
          if gofmt -l . | grep -q .; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Adapter smoke tests
        if: needs.changes.outputs.go == '1'
        run: ./scripts/smoke-test.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != '1'
        with:
          node-version: "22"

      - name: Test Cursor quota decoder
        if: needs.changes.outputs.docs_only != '1'
        run: node --test internal/cursorbridge/extension/decoder.test.cjs

  test-shard:
    needs: changes
    if: needs.changes.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two shards: 0 = cmd/downshift (the suite's wall-clock floor), 1 = the
        # rest. scripts/ci-shard-packages.sh owns the deterministic split.
        shard: [0, 1]
    env:
      DOWNSHIFT_TEST_TIMING: "1" # enforce wall-clock test budgets (internal/testenv/timing.go)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (shard ${{ matrix.shard }})
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "2"
        run: |
          # Pull requests test the changed packages and their dependents; pushes
          # to main, and any change outside Go package directories, test ./...
          # ci-shard-packages.sh re-uses ci-test-packages.sh, then keeps only the
          # packages assigned to this shard. Every package lands in exactly one
          # shard, and the union over shards equals the full list.
          pkgs=$(bash scripts/ci-shard-packages.sh)
          if [ -z "$pkgs" ]; then
            echo "No packages assigned to shard $SHARD_INDEX."
            exit 0
          fi
          echo "Shard $SHARD_INDEX testing $(echo "$pkgs" | wc -l | tr -d ' ') package line(s):"
          echo "$pkgs"
          go test $pkgs

  # Branch-protection required check. Stays named exactly `test` and stays green
  # only when the checks job and both test shards succeeded, so protection means
  # the same thing it did when `test` was a single job.
  test:
    needs: [changes, test-checks, test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to have succeeded
        env:
          CHECKS_RESULT: ${{ needs.test-checks.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -eu
          echo "test-checks: $CHECKS_RESULT"
          echo "test-shard:  $SHARD_RESULT"
          # A docs-only / no-Go diff skips the shards (if: go == '1'); that is a
          # pass, as it was when the single job ran only the skip echo steps.
          fail=0
          case "$CHECKS_RESULT" in success) ;; *) echo "::error::test-checks did not succeed ($CHECKS_RESULT)"; fail=1 ;; esac
          case "$SHARD_RESULT" in
            success|skipped) ;;
            *) echo "::error::test-shard did not succeed ($SHARD_RESULT)"; fail=1 ;;
          esac
          exit "$fail"


  # Cross-OS behavior check (GAP-OS-1). CI already cross-COMPILES for windows
  # and darwin; this job also RUNS the OS-sensitive packages on those runners so
  # path joining, HOME resolution, the setup writer and the exec wrapper are
  # verified, not just compiled. Scoped to the packages whose behavior differs
  # by OS to keep the matrix cheap; it uses `go test` directly (no bash CI
  # scripts, which are POSIX-only).
  test-os:
    needs: changes
    if: >-
      ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.os_sensitive == '1')
      || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOWNSHIFT_TEST_TIMING: "1" # enforce wall-clock test budgets (internal/testenv/timing.go)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build downshift CLI
        run: go build -o downshift ./cmd/downshift
      - name: Test OS-sensitive packages (all)
        # These internal packages are OS-portable and run in full on every OS.
        run: go test -timeout 15m ./internal/paths/ ./internal/execwrap/ ./internal/contextopt/ ./internal/hookctx/
      - name: Test cmd/downshift (macOS only)
        # The cmd/downshift suite still carries Unix assumptions on Windows
        # (HOME-only env, PATH binary lookup, symlink settings, POSIX perms);
        # porting it is tracked separately. On Windows the portable core above
        # is the coverage; macOS runs the scoped setup/path tests too, and the
        # full suite runs on Linux in `test`.
        if: matrix.os == 'macos-latest'
        run: go test -timeout 15m -run 'Setup|Steering|Wrapper|Config|Session|Display|Path|Project' ./cmd/downshift/

  # Race detector. Pull requests run it on the changed packages and their
  # dependents (the same selection as `test`); internal/core, whose -race run
  # takes ~5 minutes, is kept only when a file under internal/core/ changed
  # (scripts/ci-race-packages.sh). Tags run every package except internal/core
  # (the nightly ci-full covers it). Not on push to main, and not the required
  # `test` check.
  race:
    needs: changes
    if: >-
      needs.changes.outputs.go == '1'
      && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOWNSHIFT_TEST_TIMING: "1" # enforce wall-clock test budgets (internal/testenv/timing.go)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ci-test-packages.sh diffs against the PR base commit, which a
          # shallow checkout does not contain.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Race detector on changed packages (pull request)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          pkgs=$(bash scripts/ci-test-packages.sh)
          if [ "$pkgs" = "./..." ]; then
            pkgs=$(go list ./...)
          fi
          pkgs=$(printf '%s\n' "$pkgs" | bash scripts/ci-race-packages.sh)
          if [ -z "$pkgs" ]; then
            echo "No Go packages to race-test."
            exit 0
          fi
          echo "Race-testing $(echo "$pkgs" | wc -l | tr -d ' ') package(s)"
          go test -race -timeout 15m $pkgs

      - name: Test with the race detector (all but internal/core)
        if: startsWith(github.ref, 'refs/tags/v')
        run: go test -race -timeout 15m $(go list ./... | grep -v '/internal/core$')

  # End-to-end battery (`make e2e`: builds ./downshift, then runs
  # scripts/e2e/battery.py against a temp state dir). Informational: it is not
  # the required check, so `test` alone gates the merge. Runs on pull requests
  # that change Go code and on push to main (the classifier forces go=1 there).
  e2e:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.go == '1')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: End-to-end battery
        run: make e2e

  python:
    needs: changes
    if: needs.changes.outputs.python == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test DS-04 observer privacy contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ds04_observer_contract -v

      - name: Test catalog price sync validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_sync_catalog_prices.py' -v

  # Cross-compiles on tags only. Main and PRs skip it: the linux build is already
  # covered by `test`, which builds ./cmd/downshift.
  build-cross-platform:
    needs: [changes, test]
    if: startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build downshift for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -o downshift-${{ matrix.goos }}-${{ matrix.goarch }} \
          -ldflags="-s -w" ./cmd/downshift

  # CD: publishes only after every verification job has passed on the tag.
  release:
    needs: [test, test-os, race, build-cross-platform]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # keyless signing identity for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the job that signs and attests must not restore a cache written by other runs

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact version: a release must not change because goreleaser did.
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance for every archive listed in checksums.txt. Verify a
      # download with: gh attestation verify <file> --repo tiagovilasboas/downshift
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # A tag whose release has no assets must fail loudly, not leave an installer
  # that 404s. Runs even when `release` was skipped or failed.
  verify-release:
    needs: [release]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the release job and its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ needs.release.result }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          fail=0
          if [ "$RELEASE_RESULT" != success ]; then
            echo "::error::release job result is '$RELEASE_RESULT', not 'success': tag $TAG has no verified assets"
            fail=1
          fi
          ver="${TAG#v}"
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)
          for want in checksums.txt \
            "downshift_${ver}_linux_amd64.tar.gz" "downshift_${ver}_linux_arm64.tar.gz" \
            "downshift_${ver}_darwin_amd64.tar.gz" "downshift_${ver}_darwin_arm64.tar.gz" \
            "downshift_${ver}_windows_amd64.zip"; do
            if ! printf '%s\n' "$assets" | grep -qxF "$want"; then
              echo "::error::release $TAG is missing asset $want"
              fail=1
            fi
          done
          exit "$fail"
