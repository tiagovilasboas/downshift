# One-shot: merge docs PR #166 when CI is green. Delete this file after merge.
name: merge-doc-pr-166

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    if: github.event.pull_request.number == 166 && github.head_ref == 'cursor/docs-status-slash-harmonize-80e1'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for test check
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const ref = context.payload.pull_request.head.sha;
            for (let i = 0; i < 60; i++) {
              const {data} = await github.rest.checks.listForRef({owner, repo, ref});
              const test = data.check_runs.find(c => c.name === 'test');
              if (test?.status === 'completed' && test.conclusion === 'success') return;
              if (test?.status === 'completed' && test.conclusion === 'failure') {
                core.setFailed('test check failed');
                return;
              }
              await new Promise(r => setTimeout(r, 15000));
            }
            core.setFailed('timed out waiting for test');
      - name: Squash merge PR 166
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 166,
              merge_method: 'squash',
            });
