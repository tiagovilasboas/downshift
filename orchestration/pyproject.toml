[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-downshift-orchestration"
version = "0.1.0"
description = "Opt-in, local LangGraph delegation planner for harness-downshift"
requires-python = ">=3.11"
dependencies = ["langgraph==1.0.9"]

[tool.setuptools.packages.find]
where = ["src"]
