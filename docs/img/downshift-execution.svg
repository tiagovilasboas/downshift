<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
<title id="title">Downshift: the complete execution flow</title><desc id="desc">Nine stages: harness delegation, local session facts, deterministic classification, guardrails, session-restricted plan and response, harness execution, available observations, reports, and offline review. Adjacent context features and Claude Code mods are separate from routing.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#0D1117"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9CA3AF" stroke-opacity=".06"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22C55E"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22C55E"/></marker></defs>
<rect width="1600" height="1340" rx="28" fill="url(#bg)"/><rect width="1600" height="1340" rx="28" fill="url(#grid)"/>
<g transform="translate(65 34) scale(.22)"><path d="M28 22 H104 L168 86 V140 L137 171 V98 L94 55 H28 Z" fill="#F9FAFB"/><path d="M28 80 H81 L120 119 V164 L94 190 V130 L74 110 H28 Z" fill="#F9FAFB"/><path d="M28 138 H65 L103 176 L78 201 L55 178 H28 Z" fill="#22C55E"/></g><g font-family="Inter,ui-sans-serif,system-ui,Arial,sans-serif"><text x="130" y="78" font-size="36" font-weight="700" fill="#F9FAFB">Downshift: the complete execution flow</text><text x="65" y="122" font-size="23" fill="#9CA3AF">One decision per subagent spawn. Read left → right, then follow the numbered arrows.</text>
<rect x="65" y="185" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="270" y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">1. Harness delegates</text>
<text x="270" y="267" text-anchor="middle" font-size="22" fill="#F9FAFB">Task / Agent / spawn tool</text>
<text x="270" y="298" text-anchor="middle" font-size="22" fill="#F9FAFB">PreToolUse sends JSON</text>
<text x="270" y="329" text-anchor="middle" font-size="22" fill="#F9FAFB">Adapter parses the payload</text>
<rect x="595" y="185" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="800" y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">2. Resolve local facts</text>
<text x="800" y="267" text-anchor="middle" font-size="22" fill="#F9FAFB">Baseline + session candidates</text>
<text x="800" y="298" text-anchor="middle" font-size="22" fill="#F9FAFB">Exact session metadata first</text>
<text x="800" y="329" text-anchor="middle" font-size="22" fill="#F9FAFB">Catalog fallback; quota cache</text>
<rect x="1125" y="185" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="1330" y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">3. Classify the task</text>
<text x="1330" y="267" text-anchor="middle" font-size="22" fill="#F9FAFB">EN / PT-BR weighted signals</text>
<text x="1330" y="298" text-anchor="middle" font-size="22" fill="#F9FAFB">In-process FNV hash boost</text>
<text x="1330" y="329" text-anchor="middle" font-size="22" fill="#F9FAFB">Confidence + language + risk</text>
<path d="M475 280 H587" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M1005 280 H1117" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="1125" y="470" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="1330" y="513" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">4. Guard the decision</text>
<text x="1330" y="552" text-anchor="middle" font-size="22" fill="#F9FAFB">Tier + recommended effort</text>
<text x="1330" y="583" text-anchor="middle" font-size="22" fill="#F9FAFB">Check doubt and risk guards</text>
<text x="1330" y="614" text-anchor="middle" font-size="22" fill="#F9FAFB">Project floor + re-check</text>
<rect x="595" y="470" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="800" y="513" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">5. Plan and emit</text>
<text x="800" y="552" text-anchor="middle" font-size="22" fill="#F9FAFB">Eligible session IDs only</text>
<text x="800" y="583" text-anchor="middle" font-size="22" fill="#F9FAFB">Quota / explicit-model guards</text>
<text x="800" y="614" text-anchor="middle" font-size="22" fill="#F9FAFB">Rewrite, hold, or control arm</text>
<rect x="65" y="470" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="270" y="513" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">6. Harness executes</text>
<text x="270" y="552" text-anchor="middle" font-size="22" fill="#F9FAFB">May honor or ignore the rewrite</text>
<text x="270" y="583" text-anchor="middle" font-size="22" fill="#F9FAFB">KiroCrew: policy / retry only</text>
<text x="270" y="614" text-anchor="middle" font-size="22" fill="#F9FAFB">Downshift does not run the child</text>
<path d="M1330 375 V462" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M1125 565 H1013" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M595 565 H483" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="65" y="760" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="270" y="803" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">7. Observe and record</text>
<text x="270" y="842" text-anchor="middle" font-size="22" fill="#F9FAFB">Honor / status where available</text>
<text x="270" y="873" text-anchor="middle" font-size="22" fill="#F9FAFB">Claude Code: usage + checks</text>
<text x="270" y="904" text-anchor="middle" font-size="22" fill="#F9FAFB">Local prompt-free events.jsonl</text>
<rect x="595" y="760" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="800" y="803" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">8. Read the evidence</text>
<text x="800" y="842" text-anchor="middle" font-size="22" fill="#F9FAFB">stats / report / verification-report</text>
<text x="800" y="873" text-anchor="middle" font-size="22" fill="#F9FAFB">session tree / watch / doctor</text>
<text x="800" y="904" text-anchor="middle" font-size="22" fill="#F9FAFB">List-price cost, not an invoice</text>
<rect x="1125" y="760" width="410" height="190" rx="20" fill="#161B22" stroke="#22C55E" stroke-width="2.5"/><text x="1330" y="803" text-anchor="middle" font-size="27" font-weight="700" fill="#22C55E">9. Review offline</text>
<text x="1330" y="842" text-anchor="middle" font-size="22" fill="#F9FAFB">Benchmarks + reviewed feedback</text>
<text x="1330" y="873" text-anchor="middle" font-size="22" fill="#F9FAFB">Candidate classifiers in shadow</text>
<text x="1330" y="904" text-anchor="middle" font-size="22" fill="#F9FAFB">Explicit opt-in to change routing</text>
<path d="M270 660 V752" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#g)"/>
<path d="M475 855 H587" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#g)"/>
<path d="M1005 855 H1117" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="800" y="1010" text-anchor="middle" font-size="21" fill="#9CA3AF">No automatic feedback arrow: observations inform a reviewed future policy change.</text>
<rect x="65" y="1060" width="465" height="160" rx="20" fill="#161B22" stroke="#9CA3AF" stroke-width="2.5"/><text x="297" y="1103" text-anchor="middle" font-size="27" font-weight="700" fill="#9CA3AF">Context tools</text>
<text x="297" y="1142" text-anchor="middle" font-size="22" fill="#F9FAFB">Hook sensor: bytes, observe only</text>
<text x="297" y="1173" text-anchor="middle" font-size="22" fill="#F9FAFB">CLI compression is an explicit step</text>
<rect x="565" y="1060" width="465" height="160" rx="20" fill="#161B22" stroke="#9CA3AF" stroke-width="2.5"/><text x="797" y="1103" text-anchor="middle" font-size="27" font-weight="700" fill="#9CA3AF">Claude Code extras</text>
<text x="797" y="1142" text-anchor="middle" font-size="22" fill="#F9FAFB">Plugin + statusline + vendored mods</text>
<text x="797" y="1173" text-anchor="middle" font-size="22" fill="#F9FAFB">Router mod: experimental, opt-in</text>
<rect x="1065" y="1060" width="470" height="160" rx="20" fill="#161B22" stroke="#9CA3AF" stroke-width="2.5"/><text x="1300" y="1103" text-anchor="middle" font-size="27" font-weight="700" fill="#9CA3AF">External companion</text>
<text x="1300" y="1142" text-anchor="middle" font-size="22" fill="#F9FAFB">Headroom detected and recorded</text>
<text x="1300" y="1173" text-anchor="middle" font-size="22" fill="#F9FAFB">Never installed or wrapped here</text>
<text x="800" y="1265" text-anchor="middle" font-size="21" fill="#9CA3AF">Missing evidence stays unknown. Errors or uncertainty preserve the requested spawn.</text>
<text x="800" y="1310" text-anchor="middle" font-size="21" fill="#9CA3AF">Downshift by Tiago Vilas Boas · https://github.com/tiagovilasboas/downshift</text>
</g></svg>
