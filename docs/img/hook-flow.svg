<title id="t">Downshift hook flow for Claude Code</title>
<desc id="d">A Claude Code subagent spawn triggers the PreToolUse hook, which classifies the task, picks a tier from the catalog and session allowlist, and returns updatedInput.model as a family name. The child runs, PostToolUse records the resolved model and SubagentStop records the child's transcript token counts and model. Any error fails open.</desc>
