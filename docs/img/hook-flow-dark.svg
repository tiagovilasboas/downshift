<svg xmlns="http://www.w3.org/2000/svg" width="900" height="578" viewBox="0 0 900 578" role="img" aria-labelledby="t d">
<title id="t">Downshift hook flow for Claude Code</title>
<desc id="d">A Claude Code subagent spawn triggers the PreToolUse hook, which classifies the task, picks a tier from the catalog and session allowlist, and returns updatedInput.model as a family name. The child runs, PostToolUse records the resolved model and SubagentStop prices the child from its transcript. Any error fails open.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9CA3AF"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker>
</defs>
<rect width="900" height="578" rx="12" fill="#0D1117"/>
<text x="40" y="44" fill="#F9FAFB" font-size="20" font-weight="700" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Hook flow for one Claude Code subagent</text>
<text x="40" y="64" fill="#9CA3AF" font-size="12.5" font-weight="400" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Deterministic end to end. No LLM and no network call in the routing path.</text>
<line x1="40" y1="80" x2="860" y2="80" stroke="#30363D"/>
<rect x="35" y="112" width="185" height="104" rx="9" fill="#161B22" stroke="#6E7681" stroke-width="1.4"/>
