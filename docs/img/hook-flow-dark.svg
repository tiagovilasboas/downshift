<rect x="35" y="430" width="830" height="38" rx="9" fill="#0D1117" stroke="#22C55E" stroke-width="1.2"/>
<text x="450" y="454" fill="#22C55E" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Fail-open: any error, missing field or unknown session lets the spawn through unchanged.</text>
<text x="35" y="498" fill="#9CA3AF" font-size="12" font-weight="400" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Why a family name: the Claude Code schema rejects full model ids in the Task model field,</text>
<text x="35" y="516" fill="#9CA3AF" font-size="12" font-weight="400" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">so Downshift writes haiku, sonnet or opus, and only when the session exposes that model.</text>
