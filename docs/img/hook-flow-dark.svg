<text x="772.5" y="155" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">catalog + session</text>
<text x="772.5" y="171" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">allowlist choose a model</text>
<circle cx="696" cy="110" r="12" fill="#22C55E"/>
<text x="696" y="114.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">4</text>
<rect x="680" y="292" width="185" height="104" rx="9" fill="#10301D" stroke="#22C55E" stroke-width="1.4"/>
<text x="772.5" y="316" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Rewrite</text>
<text x="772.5" y="335" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">updatedInput.model =</text>
<text x="772.5" y="351" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">haiku | sonnet | opus</text>
<circle cx="696" cy="290" r="12" fill="#22C55E"/>
<text x="696" y="294.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">5</text>
<rect x="465" y="292" width="185" height="104" rx="9" fill="#161B22" stroke="#6E7681" stroke-width="1.4"/>
<text x="557.5" y="316" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Child runs</text>
<text x="557.5" y="335" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">on the chosen model</text>
<text x="557.5" y="351" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">(or the original one)</text>
<circle cx="481" cy="290" r="12" fill="#6E7681"/>
<text x="481" y="294.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">6</text>
<rect x="250" y="292" width="185" height="104" rx="9" fill="#10301D" stroke="#22C55E" stroke-width="1.4"/>
<text x="342.5" y="316" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">PostToolUse hook</text>
<text x="342.5" y="335" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">records the model the</text>
<text x="342.5" y="351" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">harness resolved</text>
<circle cx="266" cy="290" r="12" fill="#22C55E"/>
<text x="266" y="294.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">7</text>
<rect x="35" y="292" width="185" height="104" rx="9" fill="#10301D" stroke="#22C55E" stroke-width="1.4"/>
<text x="127.5" y="316" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">SubagentStop hook</text>
<text x="127.5" y="335" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">prices the child from</text>
