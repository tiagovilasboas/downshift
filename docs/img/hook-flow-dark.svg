<text x="127.5" y="155" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Claude Code calls the</text>
<text x="127.5" y="171" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Task / Agent tool</text>
<circle cx="51" cy="110" r="12" fill="#6E7681"/>
<text x="51" y="114.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">1</text>
<rect x="250" y="112" width="185" height="104" rx="9" fill="#10301D" stroke="#22C55E" stroke-width="1.4"/>
<text x="342.5" y="136" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">PreToolUse hook</text>
<text x="342.5" y="155" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">downshift claude-code</text>
<text x="342.5" y="171" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">reads the payload (stdin)</text>
<circle cx="266" cy="110" r="12" fill="#22C55E"/>
<text x="266" y="114.5" fill="#0D1117" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">2</text>
<rect x="465" y="112" width="185" height="104" rx="9" fill="#10301D" stroke="#22C55E" stroke-width="1.4"/>
<text x="557.5" y="136" fill="#F9FAFB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Classify</text>
<text x="557.5" y="155" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">scored signals on the</text>
<text x="557.5" y="171" fill="#9CA3AF" font-size="11.5" font-weight="400" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">task text. No LLM.</text>
<circle cx="481" cy="110" r="12" fill="#22C55E"/>
