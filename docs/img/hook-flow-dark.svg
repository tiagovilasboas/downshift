<text x="56" y="552" fill="#9CA3AF" font-size="12" font-weight="400" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Downshift hook step</text>
<rect x="200" y="540" width="14" height="14" rx="3" fill="#161B22" stroke="#6E7681" stroke-width="1.4"/>
<text x="221" y="552" fill="#9CA3AF" font-size="12" font-weight="400" text-anchor="start" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Claude Code</text>
