<svg xmlns="http://www.w3.org/2000/svg" width="900" height="676" viewBox="0 0 900 676" role="img" aria-labelledby="t d">
<title id="t">Downshift package architecture</title>
<desc id="d">cmd/downshift wires five harness adapters (claudecode, cursor, codex, antigravity, kirocrew), the catalog and telemetry. Adapters, catalog and telemetry import core; core imports none of them. internal/paths holds the state directory. routingv2, outcome, benchmark, decisionintelligence and models are offline or opt-in.</desc>
