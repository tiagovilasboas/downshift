<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="t d">
<title id="t">Downshift BDI agentic routing loop</title>
<desc id="d">Belief-Desire-Intention view of Downshift: harness adapters perceive spawn payloads; core maintains beliefs from deterministic classification and catalog; desires are cost-safe tier goals; intentions are checked decisions and rewrite plans; action is the hook response. No LLM in the deliberation loop.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9CA3AF"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60A5FA"/></marker>
</defs>
<rect width="960" height="720" rx="12" fill="#0F172A"/>
<text x="40" y="44" fill="#F9FAFB" font-size="20" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,sans-serif">Downshift as a BDI agentic router</text>
<text x="40" y="66" fill="#9CA3AF" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif">Beliefs are computed facts (no LLM). Desires are tier goals. Intentions are committed, guardrail-checked plans. Shadow paths observe only.</text>
<line x1="40" y1="82" x2="920" y2="82" stroke="#374151"/>

<rect x="40" y="100" width="200" height="88" rx="9" fill="#422006" stroke="#F59E0B" stroke-width="1.4"/>
<text x="140" y="124" fill="#FCD34D" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Perception</text>
<text x="140" y="144" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Adapter parses hook JSON</text>
<text x="140" y="160" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">task ∑ current model ∑ caps</text>
<text x="140" y="176" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Claude ∑ Cursor ∑ Codex ∑ &</text>

<rect x="280" y="96" width="400" height="200" rx="9" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1.6"/>
<text x="480" y="120" fill="#93C5FD" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Beliefs (world state)</text>
<text x="300" y="142" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">Classification  complexity, confidence, risk[], lang guard</text>
<text x="300" y="160" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">Session  allowlist, inferred baseline, quota status</text>
<text x="300" y="178" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">Catalog Resolver  tier í model id, explicit_only</text>
<text x="300" y="196" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">HarnessCapabilities  rewrite honored?, effort field</text>
<text x="300" y="214" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">Policy floor ∑ graph label ∑ optional semantic fuse</text>
<text x="300" y="232" fill="#9CA3AF" font-size="10.5" font-family="Inter,sans-serif">Updated each PreToolUse; prompts stay in memory only</text>
<text x="300" y="278" fill="#60A5FA" font-size="10.5" font-weight="600" font-family="Inter,sans-serif">Shadow beliefs (observe, never commit): E5 embed ∑ adapt memory ∑ v2 weights</text>

<rect x="720" y="100" width="200" height="88" rx="9" fill="#500724" stroke="#F472B6" stroke-width="1.4"/>
<text x="820" y="124" fill="#F9A8D4" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Desires (goals)</text>
<text x="820" y="144" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Right-sized subagent tier</text>
<text x="820" y="160" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Doubt never spends money</text>
<text x="820" y="176" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Risk never cheap-routes</text>

<rect x="280" y="320" width="400" height="108" rx="9" fill="#14532D" stroke="#4ADE80" stroke-width="1.6"/>
<text x="480" y="344" fill="#86EFAC" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Deliberation (deterministic)</text>
<text x="300" y="366" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">core.Route  classify í tier í verdict vs current</text>
<text x="300" y="384" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">IntentFor  trivial ∑ normal ∑ review ∑ preserved</text>
<text x="300" y="402" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">core.Check  R1R9, risk downshift hold, unknown holds</text>
<text x="300" y="420" fill="#9CA3AF" font-size="10.5" font-family="Inter,sans-serif">No network ∑ no LLM chooses the route</text>

<rect x="280" y="452" width="400" height="96" rx="9" fill="#3B0764" stroke="#A78BFA" stroke-width="1.6"/>
<text x="480" y="476" fill="#C4B5FD" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Intentions (committed plan)</text>
<text x="300" y="498" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">Decision  tier, model, effort, SafeVerdict, corrections[]</text>
<text x="300" y="516" fill="#E5E7EB" font-size="11" font-family="'SF Mono',ui-monospace,monospace">PlanForSession  RewritePlan (model ± reasoning_effort)</text>
<text x="300" y="534" fill="#9CA3AF" font-size="10.5" font-family="Inter,sans-serif">Checked=true before any adapter applies a rewrite</text>

<rect x="40" y="452" width="200" height="96" rx="9" fill="#1F2937" stroke="#6B7280" stroke-width="1.4"/>
<text x="140" y="476" fill="#F9FAFB" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Action</text>
<text x="140" y="496" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Wire response</text>
<text x="140" y="512" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">updatedInput / exit 2</text>
<text x="140" y="528" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">stderr + telemetry id</text>

<rect x="720" y="452" width="200" height="96" rx="9" fill="#1F2937" stroke="#6B7280" stroke-width="1.4"/>
<text x="820" y="476" fill="#F9FAFB" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">Feedback</text>
<text x="820" y="496" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">PostToolUse honor</text>
<text x="820" y="512" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">usage ∑ child_ended</text>
<text x="820" y="528" fill="#9CA3AF" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">events.jsonl (no prompts)</text>

<path d="M240,144 H278" fill="none" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#b)"/>
<path d="M680,144 H718" fill="none" stroke="#F472B6" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M480,296 V318" fill="none" stroke="#60A5FA" stroke-width="1.8" marker-end="url(#b)"/>
<path d="M820,188 L820,280 L680,360" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M480,428 V450" fill="none" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#g)"/>
<path d="M280,500 H242" fill="none" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#g)"/>
<path d="M680,500 H718" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M140,548 V620 L480,620 L480,548" fill="none" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 4"/>

<rect x="40" y="580" width="880" height="116" rx="9" fill="#1F2937" stroke="#374151" stroke-width="1.2"/>
<text x="56" y="604" fill="#F9FAFB" font-size="12" font-weight="700" font-family="Inter,sans-serif">Mapping to code</text>
<text x="56" y="626" fill="#9CA3AF" font-size="11" font-family="Inter,sans-serif">Beliefs ê internal/core (classifier, risk, lang_guard, policy) + catalog + session-models + optional quota/scores</text>
<text x="56" y="644" fill="#9CA3AF" font-size="11" font-family="Inter,sans-serif">Desires ê EscalationIntent + product invariants (AGENTS.md: deterministic lift, preserve explicit_only)</text>
<text x="56" y="662" fill="#9CA3AF" font-size="11" font-family="Inter,sans-serif">Intentions ê Decision + RewritePlan after Check ∑ Action ê internal/adapters/* ∑ Feedback ê hookport + telemetry</text>
<text x="56" y="682" fill="#4ADE80" font-size="11" font-weight="600" font-family="Inter,sans-serif">The coding agent (parent LLM) is outside this loop; Downshift routes each subagent spawn only.</text>
</svg>
