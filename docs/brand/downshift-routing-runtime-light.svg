<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Downshift current runtime routing architecture</title>
<desc id="desc">Diagram based on the harness-downshift main branch. Harness hooks feed adapters, which call core.Route, use catalog and session allowlists, plan a safe rewrite, then emit harness-specific steering. Telemetry and decision intelligence are side paths. Capability Router v2 and orchestration planner are implemented but outside the current hook main routing path.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/></marker>
  <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/></marker>
  <style>
    .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#111827}
    .m{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#57606A}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#57606A}
    .box{fill:#F6F8FA;stroke:#D0D7DE;stroke-width:1.3}
    .box2{fill:#FFFFFF;stroke:#D0D7DE;stroke-width:1.3}
    .dash{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.3;stroke-dasharray:7 6}
    .arrow{fill:none;stroke:#22C55E;stroke-width:2.4;marker-end:url(#arr)}
    .arrowm{fill:none;stroke:#8C959F;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arr-muted)}
  </style>
</defs>
<g id="optional-background"><rect width="1600" height="1040" fill="#FFFFFF"/></g>
<g transform="translate(28 24) scale(.26)">
  <path d="M28 22 H104 L168 86 V140 L137 171 V98 L94 55 H28 Z" fill="#111827"/>
  <path d="M28 80 H81 L120 119 V164 L94 190 V130 L74 110 H28 Z" fill="#111827"/>
  <path d="M28 138 H65 L103 176 L78 201 L55 178 H28 Z" fill="#22C55E"/>
</g><text x="92" y="55" class="t" font-size="26" font-weight="800" letter-spacing="1.2">DOWNSHIFT</text>
<text x="92" y="79" class="m" font-size="11" font-weight="700" letter-spacing="2.8">CURRENT RUNTIME ROUTING · MAIN BRANCH</text>
<text x="1570" y="44" class="m" text-anchor="end" font-size="11">One harness. Any model.</text>
<line x1="30" y1="102" x2="1570" y2="102" stroke="#D0D7DE"/>
<text x="50" y="140" class="m" font-size="11" font-weight="700" letter-spacing="2">HARNESS EDGE</text><rect x="50" y="166" width="270" height="80" rx="10" class="box"/><text x="68" y="190" class="t" font-size="15" font-weight="700">Claude Code</text><text x="68" y="211" class="mono" font-size="10">Task · PreToolUse</text><text x="68" y="229" class="m" font-size="10">updatedInput.model</text><path d="M320 206 H356" class="arrow"/><rect x="50" y="260" width="270" height="80" rx="10" class="box"/><text x="68" y="284" class="t" font-size="15" font-weight="700">Cursor</text><text x="68" y="305" class="mono" font-size="10">Task · preToolUse</text><text x="68" y="323" class="m" font-size="10">updated_input.model</text><path d="M320 300 H356" class="arrow"/><rect x="50" y="354" width="270" height="80" rx="10" class="box"/><text x="68" y="378" class="t" font-size="15" font-weight="700">Codex</text><text x="68" y="399" class="mono" font-size="10">spawn_agent · PreToolUse</text><text x="68" y="417" class="m" font-size="10">model + reasoning_effort</text><path d="M320 394 H356" class="arrow"/><rect x="50" y="448" width="270" height="80" rx="10" class="box"/><text x="68" y="472" class="t" font-size="15" font-weight="700">Antigravity</text><text x="68" y="493" class="mono" font-size="10">invoke_subagent / spawn_agent</text><text x="68" y="511" class="m" font-size="10">tier → flash_lite / flash / pro</text><path d="M320 488 H356" class="arrow"/><rect x="50" y="542" width="270" height="80" rx="10" class="box"/><text x="68" y="566" class="t" font-size="15" font-weight="700">KiroCrew</text><text x="68" y="587" class="mono" font-size="10">preToolUse</text><text x="68" y="605" class="m" font-size="10">allow or exit 2 + respawn guidance</text><path d="M320 582 H356" class="arrow"/><rect x="360" y="166" width="220" height="456" rx="12" class="box2"/>
<text x="382" y="196" class="t" font-size="16" font-weight="800">Harness Adapter</text>
<text x="382" y="216" class="m" font-size="10">internal/adapters/*</text>
<circle cx="387" cy="248" r="3" fill="#22C55E"/><text x="400" y="252" class="m" font-size="11">Parse hook JSON</text><circle cx="387" cy="280" r="3" fill="#22C55E"/><text x="400" y="284" class="m" font-size="11">Validate subagent tool</text><circle cx="387" cy="312" r="3" fill="#22C55E"/><text x="400" y="316" class="m" font-size="11">Extract task text</text><circle cx="387" cy="344" r="3" fill="#22C55E"/><text x="400" y="348" class="m" font-size="11">Read requested/current model</text><circle cx="387" cy="376" r="3" fill="#22C55E"/><text x="400" y="380" class="m" font-size="11">Inject catalog Resolver</text><circle cx="387" cy="408" r="3" fill="#22C55E"/><text x="400" y="412" class="m" font-size="11">Call core.Route(...)</text><circle cx="387" cy="440" r="3" fill="#22C55E"/><text x="400" y="444" class="m" font-size="11">Resolve session model allowlist</text><circle cx="387" cy="472" r="3" fill="#22C55E"/><text x="400" y="476" class="m" font-size="11">Build rewrite plan</text><circle cx="387" cy="504" r="3" fill="#22C55E"/><text x="400" y="508" class="m" font-size="11">Emit harness-specific response</text><circle cx="387" cy="536" r="3" fill="#22C55E"/><text x="400" y="540" class="m" font-size="11">Fail-open on any error</text><path d="M580 300 H620" class="arrow"/><rect x="620" y="166" width="430" height="456" rx="14" class="box" stroke="#22C55E" stroke-width="1.6"/>
<text x="645" y="198" class="t" font-size="17" font-weight="800">core.Route — authoritative runtime decision</text>
<text x="645" y="219" class="m" font-size="10">internal/core · deterministic · zero LLM calls · zero network</text>
<rect x="646" y="236" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="258" text-anchor="middle" class="t" font-size="12" font-weight="800">1</text><text x="695" y="254" class="t" font-size="12" font-weight="700">Classify(prompt)</text><text x="695" y="271" class="m" font-size="10">regex weighted signals + structural nudges</text><rect x="646" y="297" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="319" text-anchor="middle" class="t" font-size="12" font-weight="800">2</text><text x="695" y="315" class="t" font-size="12" font-weight="700">Complexity → Tier</text><text x="695" y="332" class="m" font-size="10">TRIVIAL→SMALL · SIMPLE/MEDIUM→MID · COMPLEX→FRONTIER</text><rect x="646" y="358" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="380" text-anchor="middle" class="t" font-size="12" font-weight="800">3</text><text x="695" y="376" class="t" font-size="12" font-weight="700">Tier → Effort</text><text x="695" y="393" class="m" font-size="10">cross-harness reasoning intensity</text><rect x="646" y="419" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="441" text-anchor="middle" class="t" font-size="12" font-weight="800">4</text><text x="695" y="437" class="t" font-size="12" font-weight="700">Resolver.ModelFor</text><text x="695" y="454" class="m" font-size="10">catalog picks harness model for target tier</text><rect x="646" y="480" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="502" text-anchor="middle" class="t" font-size="12" font-weight="800">5</text><text x="695" y="498" class="t" font-size="12" font-weight="700">Compare current model</text><text x="695" y="515" class="m" font-size="10">OK · DOWNSHIFT · UPSHIFT · UNKNOWN + savings</text><rect x="646" y="541" width="34" height="34" rx="8" fill="#22C55E" opacity="0.16" stroke="#22C55E"/><text x="663" y="563" text-anchor="middle" class="t" font-size="12" font-weight="800">6</text><text x="695" y="559" class="t" font-size="12" font-weight="700">Intent + confidence</text><text x="695" y="576" class="m" font-size="10">preserve/review intent; uncertain downgrade is gated</text><path d="M1050 300 H1090" class="arrow"/><rect x="1090" y="166" width="460" height="456" rx="14" class="box2"/>
<text x="1115" y="198" class="t" font-size="17" font-weight="800">PlanForSession + harness steering</text>
<text x="1115" y="219" class="m" font-size="10">only writes a model that the current session actually exposes</text>
<text x="1118" y="254" class="t" font-size="11" font-weight="700">Session allowlist</text><text x="1118" y="271" class="m" font-size="10">hook payload → per-session/user session-models.json</text><text x="1118" y="305" class="t" font-size="11" font-weight="700">Explicit-only preservation</text><text x="1118" y="322" class="m" font-size="10">operator-selected specialised models are never auto-replaced</text><text x="1118" y="356" class="t" font-size="11" font-weight="700">Confidence gate</text><text x="1118" y="373" class="m" font-size="10">uncertain classified downgrade is not blindly applied</text><text x="1118" y="407" class="t" font-size="11" font-weight="700">Session target selection</text><text x="1118" y="424" class="m" font-size="10">classified ID, otherwise cheapest/strongest eligible session model</text><text x="1118" y="458" class="t" font-size="11" font-weight="700">Cursor Option A</text><text x="1118" y="475" class="m" font-size="10">prefer same model family, switch effort when compatible</text><text x="1118" y="509" class="t" font-size="11" font-weight="700">Codex effort</text><text x="1118" y="526" class="m" font-size="10">translate effort through catalog effort_map</text><rect x="1115" y="548" width="410" height="50" rx="9" fill="#22C55E" opacity="0.13" stroke="#22C55E"/><text x="1135" y="570" class="t" font-size="11" font-weight="800">OUTPUT</text><text x="1135" y="588" class="m" font-size="10">rewrite model/effort, allow unchanged, or KiroCrew respawn instruction</text><text x="50" y="670" class="m" font-size="11" font-weight="700" letter-spacing="2">RUNTIME SUPPORT</text><rect x="50" y="690" width="330" height="134" rx="11" class="box"/><rect x="50" y="690" width="5" height="134" rx="3" fill="#0969DA"/><text x="70" y="717" class="t" font-size="13" font-weight="800">Catalog Resolver</text><text x="70" y="742" class="mono" font-size="9.6">embedded internal/catalog/catalog.json</text><text x="70" y="765" class="m" font-size="10">optional ~/.harness-downshift/catalog.json</text><text x="70" y="790" class="m" font-size="10">IDs · aliases · family · tier · cost · effort · explicit_only</text><rect x="400" y="690" width="330" height="134" rx="11" class="box"/><rect x="400" y="690" width="5" height="134" rx="3" fill="#168A3F"/><text x="420" y="717" class="t" font-size="13" font-weight="800">Local observability</text><text x="420" y="742" class="mono" font-size="9.6">~/.harness-downshift/events.jsonl</text><text x="420" y="765" class="m" font-size="10">prompt contents are never persisted</text><text x="420" y="790" class="m" font-size="10">routing metadata · stats · feedback IDs</text><rect x="750" y="690" width="330" height="134" rx="11" class="box"/><rect x="750" y="690" width="5" height="134" rx="3" fill="#8250DF"/><text x="770" y="717" class="t" font-size="13" font-weight="800">Decision Intelligence</text><text x="770" y="742" class="mono" font-size="9.6">shadow recommendation only</text><text x="770" y="765" class="m" font-size="10">monotonic: may keep/elevate tier; Apply=false</text><text x="770" y="790" class="m" font-size="10">never replaces deterministic routing gates</text><path d="M215 690 V648 H785 V622" class="arrowm"/><path d="M565 690 V644 H500 V622" class="arrowm"/><path d="M915 690 V648 H880 V622" class="arrowm"/><text x="1120" y="670" class="m" font-size="11" font-weight="700" letter-spacing="2">IMPLEMENTED, OUTSIDE CURRENT HOOK MAIN PATH</text><rect x="1120" y="690" width="430" height="150" rx="11" class="dash"/>
<text x="1142" y="717" class="t" font-size="13" font-weight="800">Capability Router v2</text>
<text x="1142" y="738" class="m" font-size="10">internal/routingv2 · available for train / benchmark --compare</text>
<text x="1142" y="768" class="mono" font-size="10">13 signals → safety floor → softmax → risk policy → matcher</text>
<text x="1142" y="792" class="m" font-size="10">Model/provider agnostic; offline weights + capability-aware design.</text>
<text x="1142" y="816" class="m" font-size="10">Not the adapter runtime call today: adapters still invoke core.Route.</text>
<rect x="1120" y="858" width="430" height="128" rx="11" class="dash"/>
<text x="1142" y="885" class="t" font-size="13" font-weight="800">Go orchestration planner</text>
<text x="1142" y="906" class="m" font-size="10">internal/orchestration · separate typed planning boundary</text>
<text x="1142" y="935" class="mono" font-size="10">dedup → preserve order → max_delegates / capability cap</text>
<text x="1142" y="960" class="m" font-size="10">Does not infer subtasks and does not choose agent or model.</text>
<rect x="50" y="858" width="1030" height="128" rx="11" class="box2"/>
<text x="72" y="886" class="t" font-size="13" font-weight="800">What actually happens on a subagent spawn</text>
<text x="72" y="914" class="m" font-size="10.5">1. Harness emits its hook event → 2. adapter extracts the child task → 3. core.Route classifies and selects a tier/model from the catalog →</text>
<text x="72" y="936" class="m" font-size="10.5">4. PlanForSession proves the target exists in that session and respects explicit/confidence gates → 5. adapter emits the harness-native rewrite.</text>
<text x="72" y="963" class="m" font-size="10.5">Every failure path is fail-open: Downshift must not become an availability risk for the coding harness.</text>
<text x="50" y="1020" class="m" font-size="9">Source: github.com/tiagovilasboas/harness-downshift · main branch read 2026-09-30 · diagram reflects code, not roadmap claims.</text></svg>