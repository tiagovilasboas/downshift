<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Example: command output becomes a shorter summary</title><desc id="desc">Illustrative test output lists five passing tests. The compactor returns a shorter passing summary and preserves exit status. If CCR is enabled, raw output is stored locally and can be retrieved later. The example is synthetic, not actual output or measured performance.</desc>
<rect width="1600" height="700" rx="24" fill="#0c1010"/><g font-family="Arial,sans-serif"><text x="60" y="60" fill="#f3f5f3" font-size="32" font-weight="700">Shorter command output. Original available with CCR.</text><text x="60" y="98" fill="#a3aca5" font-size="19">Illustrative example · Synthetic data · Exact output varies by command and format</text>
<rect x="60" y="140" width="430" height="285" rx="16" fill="#141b17" stroke="#4c6653"/><text x="85" y="181" fill="#f3f5f3" font-size="20" font-weight="700">1  RAW TEST OUTPUT</text><g font-family="monospace" font-size="19" fill="#b8c7bb"><text x="85" y="225">auth:     PASS</text><text x="85" y="256">api:      PASS</text><text x="85" y="287">storage:  PASS</text><text x="85" y="318">search:   PASS</text><text x="85" y="349">ui:       PASS</text><text x="85" y="390" fill="#9ba89e">exit status: 0</text></g>
<rect x="565" y="187" width="300" height="192" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="590" y="232" fill="#f3f5f3" font-size="22" font-weight="700">2  COMPACTOR</text><text x="590" y="271" fill="#a3aca5" font-size="18">Processes a supported</text><text x="590" y="298" fill="#a3aca5" font-size="18">command output format.</text><text x="590" y="340" fill="#a3aca5" font-size="18">Keeps status and failures.</text>
<rect x="940" y="140" width="600" height="285" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="965" y="181" fill="#f3f5f3" font-size="20" font-weight="700">3  SHORTER RESULT FOR THE AGENT</text><g font-family="monospace" font-size="19" fill="#b8c7bb"><text x="965" y="235" fill="#22c55e">PASS: test results summarized</text><text x="965" y="271">5 passing tests</text><text x="965" y="307">failure details: none</text><text x="965" y="349" fill="#9ba89e">exit status: 0</text></g>
<path d="M490 282H548 M865 282H923" stroke="#22c55e" stroke-width="3"/><path d="M536 273l12 9-12 9M911 273l12 9-12 9" fill="none" stroke="#22c55e" stroke-width="3"/>
<rect x="565" y="495" width="975" height="133" rx="16" fill="#171b19" stroke="#728177"/><text x="590" y="537" fill="#f3f5f3" font-size="21" font-weight="700">CCR ENABLED · RAW OUTPUT STORED LOCALLY</text><text x="590" y="573" fill="#a3aca5" font-size="18">Retrieve the original later when you need more detail.</text><text x="590" y="601" fill="#a3aca5" font-size="18">Raw output may contain sensitive data; review local retention settings.</text>
<path d="M275 425V560H545" stroke="#829087" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/><path d="M533 551l12 9-12 9" fill="none" stroke="#829087" stroke-width="2.5"/><text x="60" y="675" fill="#a3aca5" font-size="17">CCR recovery is conditional on it being enabled and the output being stored.</text></g></svg>
