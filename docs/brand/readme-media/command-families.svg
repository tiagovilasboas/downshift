<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><title>Which command output can Downshift handle?</title><rect width="1400" height="650" rx="24" fill="#0c1010"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22c55e"/></marker></defs><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#f3f5f3" font-size="32" font-weight="700">Which command output can Downshift handle?</text><text x="60" y="102" fill="#a3aca5" font-size="20">Examples of recognized families; individual command forms and behavior are documented separately.</text><rect x="60" y="145" width="290" height="150" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="82" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Tests</text><text x="82" y="216" fill="#a3aca5" font-size="17">Go tests · Pytest · Vitest</text><text x="82" y="241" fill="#a3aca5" font-size="17">Summarizes passing results</text><rect x="390" y="145" width="290" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="412" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Builds and checks</text><text x="412" y="216" fill="#a3aca5" font-size="17">Go build · TypeScript · ESLint</text><text x="412" y="241" fill="#a3aca5" font-size="17">Supported reports are processed</text><rect x="720" y="145" width="290" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="742" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Git</text><text x="742" y="216" fill="#a3aca5" font-size="17">Status · Diff · Show</text><text x="742" y="241" fill="#a3aca5" font-size="17">Output handling varies by form</text><rect x="1050" y="145" width="290" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="1072" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Infrastructure</text><text x="1072" y="216" fill="#a3aca5" font-size="17">kubectl get · Docker ps</text><text x="1072" y="241" fill="#a3aca5" font-size="17">Some forms pass through raw</text><rect x="60" y="345" width="600" height="165" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="82" y="384" fill="#f3f5f3" font-size="21" font-weight="700">Recognized format</text><text x="82" y="416" fill="#a3aca5" font-size="17">The command runs and its exit code is returned.</text><text x="82" y="441" fill="#a3aca5" font-size="17">For supported failing test formats, failure lines</text><text x="82" y="466" fill="#a3aca5" font-size="17">are kept while passing lines may be reduced.</text><rect x="720" y="345" width="620" height="165" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="742" y="384" fill="#f3f5f3" font-size="21" font-weight="700">Unknown or unsupported</text><text x="742" y="416" fill="#a3aca5" font-size="17">Unrecognized output formats stay raw.</text><text x="742" y="441" fill="#a3aca5" font-size="17">A non-allowlisted command is refused by the wrapper;</text><text x="742" y="466" fill="#a3aca5" font-size="17">run the original command directly.</text><text x="60" y="575" fill="#f3f5f3" font-size="19" font-weight="700">Recognition does not guarantee smaller output.</text><text x="60" y="610" fill="#a3aca5" font-size="17">See the supported tools and benchmark documents for exact command forms and observed results.</text></g></svg>