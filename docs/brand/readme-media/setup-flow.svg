<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img"><title>From setup to a verified session</title><rect width="1400" height="610" rx="24" fill="#0c1010"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22c55e"/></marker></defs><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#f3f5f3" font-size="32" font-weight="700">From setup to a verified session</text><text x="60" y="102" fill="#a3aca5" font-size="20">Interactive setup: review the proposed changes before confirming.</text><rect x="60" y="175" width="220" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="82" y="214" fill="#f3f5f3" font-size="21" font-weight="700">1  Detect</text><text x="82" y="246" fill="#a3aca5" font-size="17">Find installed</text><text x="82" y="271" fill="#a3aca5" font-size="17">supported harnesses</text><rect x="325" y="175" width="220" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="347" y="214" fill="#f3f5f3" font-size="21" font-weight="700">2  Choose</text><text x="347" y="246" fill="#a3aca5" font-size="17">Select harnesses</text><text x="347" y="271" fill="#a3aca5" font-size="17">and components</text><rect x="590" y="175" width="220" height="150" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="612" y="214" fill="#f3f5f3" font-size="21" font-weight="700">3  Review</text><text x="612" y="246" fill="#a3aca5" font-size="17">Inspect proposed</text><text x="612" y="271" fill="#a3aca5" font-size="17">changes</text><rect x="855" y="175" width="220" height="150" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="877" y="214" fill="#f3f5f3" font-size="21" font-weight="700">4  Confirm</text><text x="877" y="246" fill="#a3aca5" font-size="17">Write selected</text><text x="877" y="271" fill="#a3aca5" font-size="17">changes after yes</text><rect x="1120" y="175" width="220" height="150" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="1142" y="214" fill="#f3f5f3" font-size="21" font-weight="700">5  Verify</text><text x="1142" y="246" fill="#a3aca5" font-size="17">Run the doctor</text><text x="1142" y="271" fill="#a3aca5" font-size="17">and review results</text><path d="M280 250 L312 250" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M545 250 L577 250" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M810 250 L842 250" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M1075 250 L1107 250" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="325" y="405" width="1015" height="110" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="347" y="444" fill="#f3f5f3" font-size="21" font-weight="700">Start a new session when needed</text><text x="347" y="476" fill="#a3aca5" font-size="17">Reload the harness, then inspect an example session to check the integration.</text><path d="M1230 325V390" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="60" y="572" fill="#a3aca5" font-size="17">The wizard supports cancellation; non-interactive options have their own documented behavior.</text></g></svg>