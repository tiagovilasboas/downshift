<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img"><title>Where Downshift works</title><rect width="1400" height="690" rx="24" fill="#0c1010"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22c55e"/></marker></defs><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#f3f5f3" font-size="32" font-weight="700">Where Downshift works</text><text x="60" y="102" fill="#a3aca5" font-size="20">Two distinct touchpoints in a coding-agent workflow; capability varies by harness and session.</text><rect x="60" y="155" width="260" height="160" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="82" y="194" fill="#f3f5f3" font-size="21" font-weight="700">Coding harness</text><text x="82" y="226" fill="#a3aca5" font-size="17">Orchestrator delegates</text><text x="82" y="251" fill="#a3aca5" font-size="17">Shell runs commands</text><text x="82" y="276" fill="#a3aca5" font-size="17">Integration varies</text><rect x="390" y="145" width="440" height="130" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="412" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Subagent spawn</text><text x="412" y="216" fill="#a3aca5" font-size="17">Policy + known session models</text><text x="412" y="241" fill="#a3aca5" font-size="17">Decision applied or held</text><rect x="940" y="145" width="400" height="130" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="962" y="184" fill="#f3f5f3" font-size="21" font-weight="700">Harness / subagent</text><text x="962" y="216" fill="#a3aca5" font-size="17">Harness may honor a rewrite</text><text x="962" y="241" fill="#a3aca5" font-size="17">KiroCrew: policy mode</text><rect x="390" y="330" width="440" height="130" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/><text x="412" y="369" fill="#f3f5f3" font-size="21" font-weight="700">Command execution</text><text x="412" y="401" fill="#a3aca5" font-size="17">Direct wrapper or harness integration</text><text x="412" y="426" fill="#a3aca5" font-size="17">Compactor handles supported output</text><rect x="940" y="330" width="400" height="130" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="962" y="369" fill="#f3f5f3" font-size="21" font-weight="700">Output to agent</text><text x="962" y="401" fill="#a3aca5" font-size="17">Exit code and failure details kept</text><text x="962" y="426" fill="#a3aca5" font-size="17">CCR can store raw output locally</text><path d="M320 205 L375 205" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M830 205 L925 205" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M320 405 L375 405" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M830 395 L925 395" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><path d="M190 315V405H375" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="390" y="520" width="950" height="100" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/><text x="412" y="559" fill="#f3f5f3" font-size="21" font-weight="700">Local observation</text><text x="412" y="591" fill="#a3aca5" font-size="17">Reporting depends on the events and usage each harness exposes.</text><path d="M1340 240H1360V570H1340 M1160 460V520" stroke="#4c6653" fill="none" stroke-width="2" stroke-dasharray="7 7"/><text x="60" y="662" fill="#a3aca5" font-size="17">Automatic wrapping is integration-specific. A rewrite emitted is not proof it was honored.</text></g></svg>