" fill="#a3aca5" font-size="17">Harness may honor a rewrite</text><text x="962" y="241" fill="#a3aca5" font-size="17">KiroCrew: policy mode</text><g filter="url(#dsk-p1)"><rect x="390" y="330" width="440" height="130" rx="16" fill="#141b17" stroke="#22c55e" stroke-width="2"/></g><g filter="url(#dsk-p2)" opacity="0.55" transform="translate(1.4 -1.1)"><rect x="390" y="330" width="440" height="130" rx="16" stroke="#22c55e" style="fill:none;stroke:#22c55e;stroke-width:1.1;marker-start:none;marker-end:none"/></g><rect x="390" y="330" width="440" height="130" rx="16" fill="url(#dsk-h22c55e)"/><text x="412" y="369" fill="#f3f5f3" font-size="21" font-weight="700">Command execution</text><text x="412" y="401" fill="#a3aca5" font-size="17">Direct wrapper or harness integration</text><text x="412" y="426" fill="#a3aca5" font-size="17">Compactor handles supported output</text><g filter="url(#dsk-p1)"><rect x="940" y="330" width="400" height="130" rx="16" fill="#141b17" stroke="#4c6653" stroke-width="1"/></g><g filter="url(#dsk-p2)" opacity="0.55" transform="translate(1.4 -1.1)"><rect x="940" y="330" width="400" height="130" rx="16" stroke="#4c6653" style="fill:none;stroke:#4c6653;stroke-width:1.1;marker-start:none;marker-end:none"/></g><rect x="940" y="330" width="400" height="130" rx="16" fill="url(#dsk-h4c6653)"/><text x="962" y="369" fill="#f3f5f3" font-size="21" font-weight="700">Output to agent</text><text x="962" y="401" fill="#a3aca5" font-size="17">Exit code and failure details kept</text><text x="962" y="426" fill="#a3aca5" font-size="17">CCR can store raw output locally</text><g filter="url(#dsk-p1)"><path d="M320 205 L375 205" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /></g><g filter="url(#dsk-p2)" opacity="0.55" transform="translate(1.4 -1.1)"><path d="M320 205 L375 205" stroke="#22c55e"  style="fill:none;stroke:#22c55e;stroke-width:1.1;marker-start:none;marker-end:none"/></g><g filter="url(#dsk-p1)"><path d="M830 205 L925 205" stroke=