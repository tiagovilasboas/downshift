<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc"><title id="title">Measured results with scope</title><desc id="desc">Lossless compaction reduced bytes by 65.2 percent on 59 synthetic fixtures. With CCR, output bytes were 72 percent lower on 107 synthetic fixtures. A 46-run controlled historical study before O8 reported 24.1 percent fewer tokens per accepted run.</desc><rect width="1400" height="470" rx="24" fill="#0c1010"/><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#f3f5f3" font-size="32" font-weight="700">Evidence, with its scope</text><text x="60" y="102" fill="#a3aca5" font-size="19">Separate experiments. Different units and workloads.</text>
<rect x="60" y="140" width="400" height="245" rx="18" fill="#141b17" stroke="#4c6653"/><text x="85" y="180" fill="#aebbb1" font-size="18">LOSSLESS OUTPUT</text><text x="85" y="242" fill="#22c55e" font-size="52" font-weight="700">65.2%</text><text x="85" y="278" fill="#f4f7f4" font-size="20">fewer bytes</text><text x="85" y="323" fill="#a3aca5" font-size="17">59 fixtures · synthetic corpus</text><text x="85" y="350" fill="#a3aca5" font-size="17">Failure details and exit codes kept</text>
<rect x="500" y="140" width="400" height="245" rx="18" fill="#141b17" stroke="#4c6653"/><text x="525" y="180" fill="#aebbb1" font-size="18">OUTPUT WITH CCR</text><text x="525" y="242" fill="#22c55e" font-size="52" font-weight="700">72.0%</text><text x="525" y="278" fill="#f4f7f4" font-size="20">fewer bytes</text><text x="525" y="323" fill="#a3aca5" font-size="17">107 fixtures · synthetic corpus</text><text x="525" y="350" fill="#a3aca5" font-size="17">Raw output stored for recovery</text>
<rect x="940" y="140" width="400" height="245" rx="18" fill="#141b17" stroke="#4c6653"/><text x="965" y="180" fill="#aebbb1" font-size="18">ROUTING · HISTORICAL</text><text x="965" y="242" fill="#22c55e" font-size="52" font-weight="700">24.1%</text><text x="965" y="278" fill="#f4f7f4" font-size="20">fewer tokens per accepted run</text><text x="965" y="323" fill="#a3aca5" font-size="17">Controlled Claude Code study</text><text x="965" y="350" fill="#a3aca5" font-size="17">46 runs · before O8</text>
<text x="60" y="435" fill="#a3aca5" font-size="18">Synthetic and controlled results do not establish everyday savings. See linked evidence in the README.</text></g></svg>
